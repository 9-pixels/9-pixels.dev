<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080a10" />
    <title>Links · 9-pixels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="9P.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        color-scheme: dark;
        --bg: #080a10;
        --nav-h: 60px;
        --bar-h: 38px;
        --white: #e9ebf2;
        --dark: #11131a;
        --line: rgba(195, 204, 255, 0.13);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        font-family: "Geist", system-ui, sans-serif;
        background:
          radial-gradient(
            ellipse at 50% 44%,
            rgba(72, 86, 180, 0.14),
            transparent 50%
          ),
          var(--bg);
        color: var(--white);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* ---- background: drifting node network (same as home) ---- */
      #net {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 5;
        mix-blend-mode: screen;
      }

      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: var(--nav-h);
        background: rgba(8, 10, 16, 0.72);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 2rem;
        z-index: 100;
      }
      nav .logo {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--white);
        text-decoration: none;
      }
      nav ul {
        display: flex;
        gap: 2rem;
        list-style: none;
      }
      nav ul a {
        color: var(--white);
        text-decoration: none;
        font-size: 0.82rem;
        opacity: 0.65;
        transition: opacity 0.2s;
      }
      nav ul a:hover,
      nav ul a:focus-visible {
        opacity: 1;
      }
      nav ul .soon {
        opacity: 0.3;
        font-size: 0.82rem;
      }

      /* ---- content area: scrolls on its own, so any number of links fits ---- */
      .stage {
        position: fixed;
        top: var(--nav-h);
        left: 0;
        right: 0;
        bottom: var(--bar-h);
        z-index: 1;
        overflow-y: auto;
      }
      .page {
        width: min(920px, calc(100% - 2.4rem));
        margin: 0 auto;
        padding: 3.5rem 0;
      }
      .page h1 {
        font-size: clamp(1.9rem, 3.8vw, 3.6rem);
        font-weight: 600;
        line-height: 0.98;
        letter-spacing: -0.04em;
        text-shadow: 0 1px 14px rgba(0, 0, 0, 0.28);
      }

      /* ---- link rows: almost no body, the site background does the work ---- */
      #links {
        display: flex;
        flex-direction: column;
        gap: 18px;
        margin-top: 2.4rem;
      }
      .link {
        --b: 64px; /* badge size */
        --pad: 20px; /* space between badge and the card's border */
        display: flex;
        align-items: stretch;
        min-height: calc(var(--b) + 2 * var(--pad));
        color: var(--white);
        text-decoration: none;
        outline: none;
        border: 1px solid var(--line);
        background: rgba(195, 204, 255, 0.025);
        transition:
          border-color 0.35s,
          background 0.35s;
        animation: reveal 1.1s cubic-bezier(0.2, 0.75, 0.2, 1) both;
        animation-delay: calc(var(--i) * 110ms);
      }
      .link:hover,
      .link:focus-visible {
        border-color: color-mix(in srgb, var(--c) 55%, transparent);
        background: color-mix(in srgb, var(--c) 7%, transparent);
      }
      .link:focus-visible {
        outline: 2px solid var(--white);
        outline-offset: 4px;
      }

      /* left: square badge, translucent body + darker border of the same hue */
      .badge {
        flex: none;
        align-self: center;
        width: var(--b);
        height: var(--b);
        margin: var(--pad);
        display: flex;
        align-items: center;
        overflow: hidden;
        border: 3px solid color-mix(in srgb, var(--c) 48%, #000);
        background:
          linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px) 0 0 /
            28px 28px,
          linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px)
            0 0 / 28px 28px,
          var(--c);
        transition: width 0.45s cubic-bezier(0.2, 0.75, 0.2, 1);
      }
      .badge .ico {
        flex: none;
        width: calc(var(--b) - 6px);
        height: calc(var(--b) - 6px);
        display: grid;
        place-items: center;
        font-size: 2rem;
        font-weight: 600;
      }
      .badge svg {
        width: 44%;
        height: 44%;
      }
      .badge .name {
        padding-right: 1.4rem;
        white-space: nowrap;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.03em;
        opacity: 0;
        transform: translateX(-6px);
        transition:
          opacity 0.3s,
          transform 0.45s cubic-bezier(0.2, 0.75, 0.2, 1);
      }

      /* right: the description */
      .desc {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-end;
        text-align: right;
        padding: 0.8rem 1.6rem;
      }
      .desc p {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: clamp(0.85rem, 1.2vw, 1.05rem);
        line-height: 1.6;
        letter-spacing: -0.01em;
        opacity: 0.95;
        max-width: 40ch;
      }
      .desc .note {
        margin-top: 0.4rem;
        font-size: 0.8rem;
        opacity: 0.55;
      }

      @media (hover: hover) and (min-width: 769px) {
        .badge:hover,
        .link:focus-visible .badge {
          width: calc(var(--b) + 11.5rem);
        }
        .badge:hover .name,
        .link:focus-visible .name {
          opacity: 1;
          transform: none;
          transition-delay: 0.12s;
        }
      }

      @keyframes reveal {
        from {
          opacity: 0;
          filter: blur(6px);
        }
        to {
          opacity: 1;
          filter: blur(0);
        }
      }

      /* no hover on touch / narrow screens: the name is always shown */
      @media (max-width: 768px), (hover: none) {
        .link {
          --b: 56px;
          --pad: 12px;
          flex-direction: column;
          min-height: 0;
        }
        .badge {
          width: auto;
          align-self: stretch;
        }
        .badge .name {
          opacity: 1;
          transform: none;
        }
        .desc {
          align-items: flex-start;
          text-align: left;
          padding: 1rem 1.2rem 1.2rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--bar-h);
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0 2rem;
        background: rgba(8, 10, 16, 0.72);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-top: 1px solid var(--line);
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 0.72rem;
        color: rgba(233, 235, 242, 0.6);
      }
      footer a {
        color: inherit;
        text-underline-offset: 3px;
        transition: color 0.2s;
      }
      footer a:hover,
      footer a:focus-visible {
        color: var(--white);
      }

      @media (max-width: 768px) {
        nav {
          padding: 0 1.2rem;
        }
        footer {
          position: static;
          height: auto;
          flex-direction: column;
          align-items: flex-start;
          gap: 0.3rem;
          padding: 0.9rem 1.2rem 1.2rem;
        }
        html,
        body {
          overflow: auto;
        }
        .stage {
          position: static;
          margin-top: var(--nav-h);
          overflow: visible;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="net" aria-hidden="true"></canvas>

    <nav>
      <a href="https://9-pixels.dev" class="logo">9-pixels</a>
      <ul>
        <li><a href="https://portfolio.9-pixels.dev">For Work</a></li>
        <li><span class="soon">Contact</span></li>
      </ul>
    </nav>

    <main class="stage" id="stage">
      <div class="page">
        <h1>More Links</h1>
        <div id="links"></div>
      </div>
    </main>

    <footer>
      <span
        >© 2026 9-pixels · Code licensed under
        <a
          href="https://www.gnu.org/licenses/gpl-3.0.html"
          target="_blank"
          rel="noopener"
          >GPL v3</a
        ></span
      >
    </footer>

    <script>
      /* ---------- the links: add one object here, nothing else to touch ----------
         name   : shown inside the badge on hover
         url    : full address, with https://
         color  : the platform's accent
         icon   : a key from ICONS below (falls back to the first letter)
         desc   : the line on the right
         note   : optional, small muted line under desc
      ------------------------------------------------------------------------- */
      const LINKS = [
        {
          name: "GitLab",
          url: "https://gitlab.com/9-pixels",
          color: "#c9692f",
          icon: "gitlab",
          desc: "Nearly everything here is private. Poke around anyway, you might find something.",
        },
        {
          name: "GitHub",
          url: "https://github.com/9-pixels",
          color: "#a371f7",
          icon: "github",
          desc: "Umm, okay, for collecting some stars? Anyway, everything's in there.",
        },
        {
          name: "Reddit",
          url: "https://www.reddit.com/user/9-pixels",
          color: "#b8452a",
          icon: "reddit",
          desc: "More or less. This is where I philosophize more than I practice.",
        },
        {
          name: "Stack Overflow",
          url: "https://stackoverflow.com/users/33267677",
          color: "#3d7ab5",
          icon: "stack",
          desc: "Supposed to be a place for asking and answering questions, but I probably haven't.",
        },
      ];

      const ICONS = {
        github:
          '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>',
        gitlab:
          '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22 2 14.5 4.3 4l3.5 7h8.4l3.5-7L22 14.5z"/></svg>',
        reddit:
          '<svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="14" rx="9.5" ry="6.5"/><circle cx="3.5" cy="10.8" r="2.2"/><circle cx="20.5" cy="10.8" r="2.2"/><circle cx="17.6" cy="3.8" r="1.7"/><path d="M12 7.6 13.4 2.4 17.6 3.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.5" cy="13" r="1.5" fill="#000" fill-opacity=".45"/><circle cx="15.5" cy="13" r="1.5" fill="#000" fill-opacity=".45"/><path d="M8.8 16.6c1.9 1.3 4.5 1.3 6.4 0" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="1.2" stroke-linecap="round"/></svg>',
        stack:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v6h16v-6"/><path d="M8 17.5h8"/><path d="M8.2 13.6l7.9 1.7"/><path d="M9.6 9.6l7.3 3.4"/><path d="M12.5 5.8l6 5"/></svg>',
      };

      const list = document.getElementById("links");
      LINKS.forEach((l, i) => {
        const a = document.createElement("a");
        a.className = "link";
        a.href = l.url;
        a.target = "_blank";
        a.rel = "noopener";
        a.style.setProperty("--c", l.color);
        a.style.setProperty("--i", i);

        const badge = document.createElement("div");
        badge.className = "badge";
        const ico = document.createElement("div");
        ico.className = "ico";
        ico.setAttribute("aria-hidden", "true");
        if (ICONS[l.icon]) ico.innerHTML = ICONS[l.icon];
        else ico.textContent = l.name.charAt(0);
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = l.name;
        badge.append(ico, name);

        const desc = document.createElement("div");
        desc.className = "desc";
        const p = document.createElement("p");
        p.textContent = l.desc;
        desc.append(p);
        if (l.note) {
          const n = document.createElement("p");
          n.className = "note";
          n.textContent = l.note;
          desc.append(n);
        }

        a.append(badge, desc);
        list.append(a);
      });
    </script>
    <script>
      /* ---------- background: slow drifting node network ---------- */
      let mx = -999,
        my = -999; // cursor, viewport coordinates
      window.addEventListener(
        "pointermove",
        (e) => {
          mx = e.clientX;
          my = e.clientY;
        },
        { passive: true },
      );
      window.addEventListener("pointerleave", () => {
        mx = my = -999;
      });

      (() => {
        const cv = document.getElementById("net"),
          ctx = cv.getContext("2d");
        const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
        let W = 0,
          H = 0,
          pts = [],
          raf = 0;
        const LINK = 120,
          MOUSE = 170;

        function size() {
          const dpr = Math.min(devicePixelRatio || 1, 2);
          W = innerWidth;
          H = innerHeight;
          cv.width = W * dpr;
          cv.height = H * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          const n = Math.min(95, Math.floor((W * H) / 14000));
          pts = Array.from({ length: n }, () => ({
            x: Math.random() * W,
            y: Math.random() * H,
            vx: (Math.random() - 0.5) * 0.22,
            vy: (Math.random() - 0.5) * 0.22,
            r: Math.random() * 1.1 + 0.35,
            ph: Math.random() * 6.28,
          }));
        }

        function frame(t) {
          ctx.clearRect(0, 0, W, H);
          for (const p of pts) {
            if (!calm) {
              p.x += p.vx;
              p.y += p.vy;
              if (p.x < -10) p.x = W + 10;
              else if (p.x > W + 10) p.x = -10;
              if (p.y < -10) p.y = H + 10;
              else if (p.y > H + 10) p.y = -10;
              const dx = p.x - mx,
                dy = p.y - my,
                d = Math.hypot(dx, dy);
              if (d < 110 && d > 0) {
                p.x += (dx / d) * 0.35;
                p.y += (dy / d) * 0.35;
              } // gentle push away from cursor
            }
          }
          for (let i = 0; i < pts.length; i++) {
            const a = pts[i];
            for (let j = i + 1; j < pts.length; j++) {
              const b = pts[j],
                d = Math.hypot(a.x - b.x, a.y - b.y);
              if (d < LINK) {
                ctx.strokeStyle = `rgba(150,170,255,${(1 - d / LINK) * 0.16})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
              }
            }
            const dm = Math.hypot(a.x - mx, a.y - my);
            if (dm < MOUSE) {
              ctx.strokeStyle = `rgba(118,228,247,${(1 - dm / MOUSE) * 0.32})`;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(mx, my);
              ctx.stroke();
            }
            const tw = calm ? 1 : 0.7 + 0.3 * Math.sin(t * 0.0015 + a.ph);
            ctx.fillStyle = `rgba(190,202,255,${0.55 * tw})`;
            ctx.beginPath();
            ctx.arc(a.x, a.y, a.r, 0, 6.283);
            ctx.fill();
          }
          if (!calm) raf = requestAnimationFrame(frame);
        }

        size();
        frame(0);
        if (!calm) raf = requestAnimationFrame(frame);
        addEventListener("resize", size, { passive: true });
        document.addEventListener("visibilitychange", () => {
          // don't burn battery in background tabs
          if (calm) return;
          if (document.hidden) cancelAnimationFrame(raf);
          else raf = requestAnimationFrame(frame);
        });
      })();
    </script>
  </body>
</html>
